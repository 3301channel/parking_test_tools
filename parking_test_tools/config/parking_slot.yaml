# 停车位定义 —— 用于泊车轨迹评估
#
# 作用：
#   1. 判断轨迹终点 / 最终停车位姿是否落在车位框内
#   2. 计算终点相对车位中心的纵向、横向、角度偏差（调参的核心指标）
#   3. 在轨迹图上画出车位框
#
# 坐标系：map
#   center 单位 m，yaw 单位 rad（与车头朝向定义一致，逆时针为正）
#   length 沿车位长轴（车头方向），width 为车位宽度，单位 m
#
# 若本文件不存在或未指定 --slot，评估脚本会退化为
# 「用 Goal 点作为车位中心 + 默认 5.0 x 2.5 m」，报告中会明确标注。
#
# 下面的值取自 20261026_155435 会话实测
#   final pose = (3719.824, 73749.035), yaw = 120.71 deg
#   goal       = (3719.716, 73749.086), yaw = 116.84 deg
# 说明：center 取「车辆停好后的位置」作为车位中心近似；
#       yaw 取本次 Goal 指定的车位朝向（目标位姿比停车位姿更接近车位真实朝向）。
#       若需严格对齐，可在 RViz 用 Publish Point 点车位框几何中心后填入。

parking_slot:
  center: [3719.82, 73749.04]
  yaw: 2.039          # 116.8 度（本次 Goal 朝向）
  length: 5.0
  width: 2.5
