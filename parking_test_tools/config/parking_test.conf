# ============================================================
# Autoware 泊车测试 —— 脚本级配置文件
#
# 用法：
#   直接改本文件，然后运行  ~/zzz/parking/start_planning_sim_log.sh
#   换一份配置：CONF_FILE=/path/to/other.conf ~/zzz/parking/start_planning_sim_log.sh
#
# 只控制脚本自身行为（启动参数 / 日志级别 / 录包 / 检查），
# 不会修改 Autoware 的任何源码、launch 或参数文件。
# 每项都标注了「能否自动生效」，标了「仅提示」的项脚本只读不改。
# ============================================================

# ---------------- 启动参数 ----------------
MAP_PATH="$HOME/autoware_data/maps/sample-map-planning"
VEHICLE_MODEL="sample_vehicle"
SENSOR_MODEL="sample_sensor_kit"

# 日志根目录（每次启动在其下新建 <年月日_时分秒>/ 子目录）
# LOG_ROOT="$HOME/autoware_logs"

# ---------------- 日志级别 ----------------
# 1=启动后尝试把泊车相关 logger 调到 debug，0=关闭
#
# 说明：本机 rcl_interfaces 只有 6 个 srv，缺 SetLoggerLevel 定义，
#       节点上也没有 set_logger_level 服务，所以这一项实际会被跳过，
#       脚本会在 set_logger_level.log 里写明跳过原因。
#       想要真正的 DEBUG 输出，只能给节点加 --ros-args --log-level debug，
#       那需要改 launch（本配置不做）。
PARKING_DEBUG=1

# ---------------- 录包 ----------------
# 1=录制关键话题，退出后自动生成轨迹图与评估报告；0=不录
RECORD_BAG=1

# 1=额外录 /tf /tf_static
# 体积代价大（几十 Hz × 上百 frame），一次演示可能从几十 MB 涨到几百 MB
RECORD_TF=0

# 1=额外录 /rosout
# 这是 ROS2 所有节点日志的汇总话题，每条带节点名 + 精确时间戳，
# 比 session.log 的文本更适合按时间窗离线复盘（ros2 bag play 后可再喂给 rqt_console）
RECORD_ROSOUT=1

# ---------------- 状态监控窗口 ----------------
# 1=Autoware 起来后新开一个终端窗口，实时显示：
#     状态机 / 场景 / 车速 / MRM / 障碍距离 / 规划是否断流
#   车停下时会直接给出原因（[!] MRM=... / [!] A*无输出12s / [!] 障碍1.1m）
# 0=不开窗口（无图形环境时会自动退化为写日志文件）
WATCH_STATE=1

# 等多久才放弃"等轨迹出现"（秒）。超时也会照常弹窗，只是提示不同。
WATCH_WAIT_SEC=300

# ---------------- 到达判定检查（仅提示，不修改 Autoware）----------------
# 1=启动后读出 mission_planner 的 arrival_check_* 并判断是否偏宽
CHECK_ARRIVAL=1

# 超过下面两个值就打印警告（Autoware 默认 1.0 / 2.0，建议收到 0.3）
ARRIVAL_LATERAL_WARN=0.5
ARRIVAL_OVERSHOOT_WARN=0.5

# 为什么这一项只能"提示"而不能"自动收紧"：
#   arrival_check_* 在 MissionPlanner 构造函数初始化列表里读一次就存进成员变量
#   （mission_planner.cpp:76  arrival_checker_(get_arrival_checker_threshold(*this))），
#   之后 ros2 param set 只改参数值、不会更新成员变量，对判定无影响；
#   planning_simulator.launch.xml 也没有把这几项暴露成可覆盖的 launch 参数。
#   因此在不改 Autoware 文件的前提下，脚本无法替你收紧。
#   需要收紧时，手动改 planning.launch.xml 里 mission_planner 节点下的：
#     arrival_check_lateral_distance                  1.0 -> 0.3
#     arrival_check_longitudinal_overshoot_distance   2.0 -> 0.3
#     arrival_check_angle_deg                        45.0 -> 10.0
#   改完重启 launch 才生效。
